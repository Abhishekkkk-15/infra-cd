version: "1.0"
jobs:
  - name: "Build API Backend"
    script: |
      echo "Building Go API server..."
      go build -o api ./cmd/infra-cd/main.go

  - name: "Install & Restart Service"
    script: |
      echo "Copying binary to /usr/local/bin/..."
      cp ./api /usr/local/bin/infra-cd-api
      chmod +x /usr/local/bin/infra-cd-api

      echo "Writing systemd unit file..."
      sudo tee /etc/systemd/system/infra-cd-api.service > /dev/null << 'EOF'
      [Unit]
      Description=infra-cd API Server
      After=network.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/infra-cd-api
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=infra-cd-api
      WorkingDirectory=/usr/local/bin

      [Install]
      WantedBy=multi-user.target
      EOF

      echo "Reloading systemd and restarting service..."
      sudo systemctl daemon-reload
      sudo systemctl enable infra-cd-api
      sudo systemctl restart infra-cd-api
      sudo systemctl is-active --quiet infra-cd-api && echo "Service started successfully." || (echo "Service failed to start!" && sudo journalctl -u infra-cd-api -n 20 --no-pager && exit 1)
