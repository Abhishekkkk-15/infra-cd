version: "1.0"
jobs:
  - name: "Build API Backend"
    script: |
      echo "Building Go API server..."
      go build -o api ./cmd/infra-cd/main.go

  - name: "Install & Restart Service"
    script: |
      echo "Stopping existing service to prevent Text file busy error..."
      sudo systemctl stop infra-cd-api || true

      echo "Copying binary to /usr/local/bin/..."
      sudo cp ./api /usr/local/bin/infra-cd-api
      sudo chmod +x /usr/local/bin/infra-cd-api

      echo "Writing environment file from injected secrets..."
      env | grep -E "^(DATABASE_URL|DB_HOST|DB_PORT|DB_USER|DB_PASSWORD|DB_NAME|DB_SSLMODE|PORT|APP_ENV|LOG_LEVEL|JWT_SECRET)=" | sudo tee /etc/infra-cd-api.env > /dev/null
      sudo chmod 600 /etc/infra-cd-api.env
      echo "  -> $(sudo wc -l < /etc/infra-cd-api.env) variable(s) written."

      echo "Writing systemd unit file..."
      sudo tee /etc/systemd/system/infra-cd-api.service > /dev/null << 'EOF'
      [Unit]
      Description=infra-cd API Server
      After=network.target
      Wants=network-online.target

      [Service]
      EnvironmentFile=/etc/infra-cd-api.env
      ExecStart=/usr/local/bin/infra-cd-api
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=infra-cd-api
      WorkingDirectory=/usr/local/bin

      [Install]
      WantedBy=multi-user.target
      EOF

      echo "Reloading systemd and restarting service..."
      sudo systemctl daemon-reload
      sudo systemctl enable infra-cd-api
      sudo systemctl restart infra-cd-api
      sudo systemctl is-active --quiet infra-cd-api && echo "Service started successfully." || (echo "Service failed to start!" && sudo journalctl -u infra-cd-api -n 30 --no-pager && exit 1)
